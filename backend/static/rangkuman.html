<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rangkuman - SuperFood Elevate</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-border: rgba(255, 255, 255, 0.1);
            --bg-input: rgba(15, 23, 42, 0.6);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-purple: #c084fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header Navigation */
        header.dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.75rem;
            box-shadow: var(--shadow-glow);
        }

        .brand-section h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-nav-links {
            display: flex;
            gap: 0.75rem;
        }

        .nav-link-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.55rem 1.1rem;
            border-radius: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-link-btn:hover, .nav-link-btn.active {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        /* Filter Controls Card */
        .filter-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-glow);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.65rem 0.9rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        select.form-control option {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .btn-submit {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
            gap: 1.5rem;
        }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chart-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-amber);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 350px;
        }

        /* Table Card */
        .table-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
        }

        .table-header-bar {
            padding: 1.1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent-amber);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.88rem;
        }

        table.data-table th {
            background-color: rgba(30, 41, 59, 0.9);
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 0.9rem 1.25rem;
            border-bottom: 2px solid var(--border-color);
            white-space: nowrap;
        }

        table.data-table th.num-col, table.data-table td.num-col {
            text-align: right;
        }

        table.data-table td {
            padding: 0.8rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            white-space: nowrap;
        }

        table.data-table tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        tr.row-subtotal {
            background-color: rgba(56, 189, 248, 0.08) !important;
            font-weight: 700;
            border-top: 1px solid rgba(56, 189, 248, 0.3);
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
        }

        tr.row-grand-total {
            background-color: rgba(192, 132, 252, 0.15) !important;
            font-weight: 800;
            font-size: 0.92rem;
            border-top: 2px solid var(--accent-purple);
            border-bottom: 2px solid var(--accent-purple);
        }

        tr.row-grand-total td {
            color: #ffffff;
        }

        /* Channel text labels without background */
        .channel-text {
            font-weight: 600;
        }

        .channel-gofood { color: #34d399; }
        .channel-grabfood { color: #10b981; }
        .channel-shopeefood { color: #fb923c; }

        /* Loading Spinner */
        .loading-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Navigation -->
        <header class="dashboard-header">
            <div class="brand-section">
                <h1>Rangkuman</h1>
            </div>

            <div class="header-nav-links">
                <a href="/rekap-tagihan-billing" class="nav-link-btn">Rekap Tagihan Billing</a>
                <a href="/rangkuman" class="nav-link-btn active">Rangkuman</a>
                <a href="/laporan-jam-ramai" class="nav-link-btn">Laporan Jam Ramai</a>
            </div>
        </header>

        <!-- Filter Controls Form -->
        <div class="filter-card">
            <form id="filterForm" onsubmit="handleFilterSubmit(event)">
                <div class="filter-grid">
                    <!-- Filter Outlet -->
                    <div class="form-group">
                        <label for="outletSelect" class="form-label">Filter Outlet</label>
                        <select id="outletSelect" class="form-control">
                            <option value="">Semua Outlet</option>
                        </select>
                    </div>

                    <!-- Filter Brand -->
                    <div class="form-group">
                        <label for="brandSelect" class="form-label">Filter Brand</label>
                        <select id="brandSelect" class="form-control">
                            <option value="">Semua Brand</option>
                        </select>
                    </div>

                    <!-- Filter Date Range: Dari -->
                    <div class="form-group">
                        <label for="startDateInput" class="form-label">Dari</label>
                        <input type="date" id="startDateInput" class="form-control" value="2026-04-01">
                    </div>

                    <!-- Filter Date Range: Hingga -->
                    <div class="form-group">
                        <label for="endDateInput" class="form-label">Hingga</label>
                        <input type="date" id="endDateInput" class="form-control" value="2026-06-30">
                    </div>

                    <!-- Submit Button -->
                    <div class="form-group">
                        <button type="submit" class="btn-submit">Tampilkan Rangkuman</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
            <!-- Bar Chart: Pendapatan Kotor -->
            <div class="chart-card">
                <h2 class="chart-title">Bar Chart: Pendapatan Kotor</h2>
                <div class="chart-container">
                    <canvas id="pendapatanKotorChart"></canvas>
                </div>
            </div>

            <!-- Bar Chart: Order Sukses -->
            <div class="chart-card">
                <h2 class="chart-title">Bar Chart: Order Sukses</h2>
                <div class="chart-container">
                    <canvas id="orderSuksesChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Rangkuman Data Table Card -->
        <div class="table-card">
            <div class="table-header-bar">
                <h2 class="table-title">Rangkuman Performa</h2>
            </div>
            
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Bulan</th>
                            <th>Channel</th>
                            <th class="num-col">Pendapatan Kotor</th>
                            <th class="num-col">Potongan Ojol</th>
                            <th class="num-col">Pendapatan Bersih</th>
                            <th class="num-col">Rata-Rata Order per Customer</th>
                            <th class="num-col">Total Order</th>
                            <th class="num-col">Order Sukses</th>
                            <th class="num-col">Order Batal</th>
                        </tr>
                    </thead>
                    <tbody id="rangkumanTableBody">
                        <tr>
                            <td colspan="9" class="loading-state">
                                <div class="spinner"></div>
                                Memuat data rangkuman...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let chartKotorInstance = null;
        let chartSuksesInstance = null;

        // Format IDR Currency
        function formatIDR(val) {
            if (val === null || val === undefined || isNaN(val)) return 'Rp 0';
            const num = Math.round(Number(val));
            const formatted = Math.abs(num).toLocaleString('id-ID');
            return num < 0 ? `-Rp ${formatted}` : `Rp ${formatted}`;
        }

        // Format Channel Text
        function getChannelTextHtml(channel) {
            if (!channel) return '-';
            const chUpper = channel.trim().toUpperCase();
            if (chUpper.includes('GOFOOD')) return `<span class="channel-text channel-gofood">GoFood</span>`;
            if (chUpper.includes('GRABFOOD')) return `<span class="channel-text channel-grabfood">GrabFood</span>`;
            if (chUpper.includes('SHOPEEFOOD')) return `<span class="channel-text channel-shopeefood">ShopeeFood</span>`;
            return `<span>${channel}</span>`;
        }

        // Initialize Filter Options
        async function initFilters() {
            try {
                const res = await fetch(`${API_BASE}/api/laporan-aplikasi-ojol/filters`);
                const json = await res.json();

                if (json.status === 'success') {
                    const outletSel = document.getElementById('outletSelect');
                    json.outlets.forEach(ot => {
                        const opt = document.createElement('option');
                        opt.value = ot; opt.textContent = ot;
                        outletSel.appendChild(opt);
                    });

                    const brandSel = document.getElementById('brandSelect');
                    json.brands.forEach(b => {
                        const opt = document.createElement('option');
                        opt.value = b; opt.textContent = b;
                        brandSel.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Error loading filters:', err);
            }
        }

        // Render Bar Charts & Table Data
        async function loadRangkumanData(params) {
            const tbody = document.getElementById('rangkumanTableBody');
            tbody.innerHTML = `<tr><td colspan="9" class="loading-state"><div class="spinner"></div>Memuat data rangkuman...</td></tr>`;

            try {
                const url = new URL(`${API_BASE}/api/laporan-aplikasi-ojol/monthly`);
                Object.keys(params).forEach(k => { if (params[k]) url.searchParams.append(k, params[k]); });

                const res = await fetch(url);
                const json = await res.json();

                if (json.status !== 'success' || !json.data || json.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="9" class="loading-state">Tidak ada data transaksi.</td></tr>`;
                    return;
                }

                // Render Table Rows
                let html = '';
                json.data.forEach(row => {
                    const isGrandTotal = row.bulan === 'Grand Total';
                    const isSubtotal = row.channel === 'Total';
                    
                    let rowClass = '';
                    if (isGrandTotal) rowClass = 'row-grand-total';
                    else if (isSubtotal) rowClass = 'row-subtotal';

                    const bulanContent = isGrandTotal ? 'Grand Total' : (isSubtotal ? `${row.bulan} Total` : row.bulan);
                    const channelContent = isGrandTotal ? '' : (isSubtotal ? 'Total' : getChannelTextHtml(row.channel));

                    html += `
                        <tr class="${rowClass}">
                            <td>${bulanContent}</td>
                            <td>${channelContent}</td>
                            <td class="num-col">${formatIDR(row.pendapatan_kotor)}</td>
                            <td class="num-col">${formatIDR(row.potongan_ojol)}</td>
                            <td class="num-col">${formatIDR(row.pendapatan_bersih)}</td>
                            <td class="num-col">${formatIDR(row.rata_rata_order_per_customer)}</td>
                            <td class="num-col">${Number(row.total_order).toLocaleString('id-ID')}</td>
                            <td class="num-col">${Number(row.order_sukses).toLocaleString('id-ID')}</td>
                            <td class="num-col">${Number(row.order_batal).toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;

                // Prepare Chart Datasets (group by Channel)
                const channelRows = json.data.filter(r => r.bulan !== 'Grand Total' && r.channel !== 'Total');
                const bulanList = [...new Set(channelRows.map(r => r.bulan))];

                const gofoodKotor = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'GoFood') || {}).pendapatan_kotor || 0);
                const grabfoodKotor = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'GrabFood') || {}).pendapatan_kotor || 0);
                const shopeefoodKotor = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'ShopeeFood') || {}).pendapatan_kotor || 0);

                const gofoodSukses = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'GoFood') || {}).order_sukses || 0);
                const grabfoodSukses = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'GrabFood') || {}).order_sukses || 0);
                const shopeefoodSukses = bulanList.map(b => (channelRows.find(r => r.bulan === b && r.channel === 'ShopeeFood') || {}).order_sukses || 0);

                // Render Bar Chart 1: Pendapatan Kotor
                const ctxKotor = document.getElementById('pendapatanKotorChart').getContext('2d');
                if (chartKotorInstance) chartKotorInstance.destroy();
                chartKotorInstance = new Chart(ctxKotor, {
                    type: 'bar',
                    data: {
                        labels: bulanList,
                        datasets: [
                            { label: 'GoFood', data: gofoodKotor, backgroundColor: 'rgba(52, 211, 153, 0.8)', borderRadius: 4 },
                            { label: 'GrabFood', data: grabfoodKotor, backgroundColor: 'rgba(16, 185, 129, 0.8)', borderRadius: 4 },
                            { label: 'ShopeeFood', data: shopeefoodKotor, backgroundColor: 'rgba(251, 146, 60, 0.8)', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8', font: { family: 'Inter', size: 11, weight: 600 } } },
                            tooltip: {
                                callbacks: {
                                    label: function(ctx) { return ` ${ctx.dataset.label}: ${formatIDR(ctx.raw)}`; }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', callback: val => `Rp ${(val/1e6).toFixed(0)}M` } }
                        }
                    }
                });

                // Render Bar Chart 2: Order Sukses
                const ctxSukses = document.getElementById('orderSuksesChart').getContext('2d');
                if (chartSuksesInstance) chartSuksesInstance.destroy();
                chartSuksesInstance = new Chart(ctxSukses, {
                    type: 'bar',
                    data: {
                        labels: bulanList,
                        datasets: [
                            { label: 'GoFood', data: gofoodSukses, backgroundColor: 'rgba(52, 211, 153, 0.8)', borderRadius: 4 },
                            { label: 'GrabFood', data: grabfoodSukses, backgroundColor: 'rgba(16, 185, 129, 0.8)', borderRadius: 4 },
                            { label: 'ShopeeFood', data: shopeefoodSukses, backgroundColor: 'rgba(251, 146, 60, 0.8)', borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#94a3b8', font: { family: 'Inter', size: 11, weight: 600 } } },
                            tooltip: {
                                callbacks: {
                                    label: function(ctx) { return ` ${ctx.dataset.label}: ${Number(ctx.raw).toLocaleString('id-ID')} Order`; }
                                }
                            }
                        },
                        scales: {
                            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8', callback: val => val.toLocaleString('id-ID') } }
                        }
                    }
                });

            } catch (err) {
                console.error('Error loading rangkuman data:', err);
                tbody.innerHTML = `<tr><td colspan="9" class="loading-state" style="color: #f87171;">Gagal memuat data rangkuman.</td></tr>`;
            }
        }

        // Handle Filter Form Submit
        function handleFilterSubmit(e) {
            e.preventDefault();
            const params = {
                outlet: document.getElementById('outletSelect').value,
                brand: document.getElementById('brandSelect').value,
                start_date: document.getElementById('startDateInput').value,
                end_date: document.getElementById('endDateInput').value
            };

            loadRangkumanData(params);
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', async () => {
            await initFilters();
            
            const initialParams = {
                outlet: '',
                brand: '',
                start_date: '2026-04-01',
                end_date: '2026-06-30'
            };

            loadRangkumanData(initialParams);
        });
    </script>
</body>
</html>
