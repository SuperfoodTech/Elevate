<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart Jam Ramai - SuperFood Elevate</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-border: rgba(255, 255, 255, 0.1);
            --bg-input: rgba(15, 23, 42, 0.6);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Header Navigation */
        header.dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.75rem;
            box-shadow: var(--shadow-glow);
        }

        .brand-section h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-nav-links {
            display: flex;
            gap: 0.75rem;
        }

        .nav-link-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.55rem 1.1rem;
            border-radius: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-link-btn:hover, .nav-link-btn.active {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        /* Filter Card */
        .filter-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-glow);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.65rem 0.9rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        select.form-control option {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .btn-submit {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0f172a;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
        }

        /* Chart Card */
        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--bg-card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-glow);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .chart-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.9rem;
        }

        .chart-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 450px;
        }

        /* Loading Spinner */
        .loading-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Navigation -->
        <header class="dashboard-header">
            <div class="brand-section">
                <h1>Laporan Jam Ramai</h1>
            </div>

            <div class="header-nav-links">
                <a href="/rekap-tagihan-billing" class="nav-link-btn">Rekap Tagihan Billing</a>
                <a href="/laporan-aplikasi-ojol" class="nav-link-btn">Laporan Aplikasi Ojol</a>
                <a href="/laporan-jam-ramai" class="nav-link-btn active">Laporan Jam Ramai</a>
            </div>
        </header>

        <!-- Filter Controls Form -->
        <div class="filter-card">
            <form id="filterForm" onsubmit="handleFilterSubmit(event)">
                <div class="filter-grid">
                    <!-- Filter Outlet -->
                    <div class="form-group">
                        <label for="outletSelect" class="form-label">Filter Outlet</label>
                        <select id="outletSelect" class="form-control">
                            <option value="">Semua Outlet</option>
                        </select>
                    </div>

                    <!-- Filter Brand -->
                    <div class="form-group">
                        <label for="brandSelect" class="form-label">Filter Brand</label>
                        <select id="brandSelect" class="form-control">
                            <option value="">Semua Brand</option>
                        </select>
                    </div>

                    <!-- Filter Date Range: Dari -->
                    <div class="form-group">
                        <label for="startDateInput" class="form-label">Dari</label>
                        <input type="date" id="startDateInput" class="form-control" value="2026-04-01">
                    </div>

                    <!-- Filter Date Range: Hingga -->
                    <div class="form-group">
                        <label for="endDateInput" class="form-label">Hingga</label>
                        <input type="date" id="endDateInput" class="form-control" value="2026-06-30">
                    </div>

                    <!-- Submit Button -->
                    <div class="form-group">
                        <button type="submit" class="btn-submit">Tampilkan Laporan</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Bar Chart Card -->
        <div class="chart-card">
            <div class="chart-header-bar">
                <h2 class="chart-title">Bar Chart: Jam Ramai</h2>
            </div>
            
            <div class="chart-container">
                <canvas id="jamRamaiChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let chartInstance = null;

        let filterMapping = [];

        // Initialize Filters & Cascading Handlers
        async function initFilters() {
            try {
                const res = await fetch(`${API_BASE}/api/performa-comparison/filters`);
                const json = await res.json();

                if (json.status === 'success') {
                    filterMapping = json.mapping || [];

                    const outletSel = document.getElementById('outletSelect');
                    const brandSel = document.getElementById('brandSelect');

                    json.outlets.forEach(ot => {
                        const opt = document.createElement('option');
                        opt.value = ot; opt.textContent = ot;
                        outletSel.appendChild(opt);
                    });

                    populateBrandOptions(outletSel.value);

                    // Outlet Change Handler -> Filter Brand
                    outletSel.addEventListener('change', () => {
                        populateBrandOptions(outletSel.value);
                    });
                }
            } catch (err) {
                console.error('Error loading filters:', err);
            }
        }

        // Populate Brands based on selected Outlet
        function populateBrandOptions(selectedOutlet) {
            const brandSel = document.getElementById('brandSelect');
            const currentVal = brandSel.value;
            brandSel.innerHTML = '<option value="">Semua Brand</option>';

            let filteredBrands = filterMapping;
            if (selectedOutlet) {
                filteredBrands = filteredBrands.filter(m => m.outlet.toLowerCase() === selectedOutlet.toLowerCase());
            }

            const uniqueBrands = [...new Set(filteredBrands.map(m => m.brand))].sort();

            uniqueBrands.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                if (b === currentVal) opt.selected = true;
                brandSel.appendChild(opt);
            });
        }

        // Fetch & Render Bar Chart: Jam Ramai
        async function renderChart(params) {
            try {
                const url = new URL(`${API_BASE}/api/laporan-jam-ramai/summary`);
                Object.keys(params).forEach(k => { if (params[k]) url.searchParams.append(k, params[k]); });

                const res = await fetch(url);
                const json = await res.json();

                if (json.status !== 'success' || !json.data || json.data.length === 0) {
                    return;
                }

                // Exclude Grand Total (jam 99)
                const hourlyData = json.data.filter(r => r.jam !== 99);

                const labels = hourlyData.map(r => `${String(r.jam).padStart(2, '0')}:00`);
                const orderData = hourlyData.map(r => r.order_sukses);
                
                // Find Max Volume for Bar Highlight Color
                const maxOrders = Math.max(...orderData);

                const bgColors = orderData.map(val => val === maxOrders && val > 0 ? '#fbbf24' : 'rgba(56, 189, 248, 0.7)');
                const borderColors = orderData.map(val => val === maxOrders && val > 0 ? '#f59e0b' : '#38bdf8');

                const ctx = document.getElementById('jamRamaiChart').getContext('2d');

                if (chartInstance) {
                    chartInstance.destroy();
                }

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Jumlah Order Sukses',
                            data: orderData,
                            backgroundColor: bgColors,
                            borderColor: borderColors,
                            borderWidth: 1.5,
                            borderRadius: 6,
                            hoverBackgroundColor: 'rgba(56, 189, 248, 0.9)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#94a3b8',
                                    font: { family: 'Inter', size: 12, weight: 600 }
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                                titleColor: '#f8fafc',
                                bodyColor: '#38bdf8',
                                borderColor: 'rgba(255, 255, 255, 0.1)',
                                borderWidth: 1,
                                padding: 12,
                                callbacks: {
                                    label: function(context) {
                                        const raw = context.raw || 0;
                                        const isPeak = raw === maxOrders;
                                        return ` Order Sukses: ${raw.toLocaleString('id-ID')} ${isPeak ? '(Jam Teramai)' : ''}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { color: '#94a3b8', font: { family: 'Inter', size: 11 } }
                            },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: {
                                    color: '#94a3b8',
                                    font: { family: 'Inter', size: 11 },
                                    callback: function(val) { return val.toLocaleString('id-ID'); }
                                }
                            }
                        }
                    }
                });
            } catch (err) {
                console.error('Error rendering chart:', err);
            }
        }

        // Handle Filter Form Submit
        function handleFilterSubmit(e) {
            e.preventDefault();
            const params = {
                outlet: document.getElementById('outletSelect').value,
                brand: document.getElementById('brandSelect').value,
                start_date: document.getElementById('startDateInput').value,
                end_date: document.getElementById('endDateInput').value
            };

            renderChart(params);
        }

        // Initial Load
        window.addEventListener('DOMContentLoaded', async () => {
            await initFilters();
            
            const initialParams = {
                outlet: '',
                brand: '',
                start_date: '2026-04-01',
                end_date: '2026-06-30'
            };

            renderChart(initialParams);
        });
    </script>
</body>
</html>
